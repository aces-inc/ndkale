[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndkale"
dynamic = ["version"]
description = "Kale: A Task Worker Library from Nextdoor"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.9"
authors = [
    { name = "Nextdoor", email = "eng@nextdoor.com" },
]
keywords = ["kale", "nextdoor", "taskworker", "sqs", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Object Brokering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.10.36",
    "pycryptodome>=3.6.6",
    "pyyaml>=5.2",
    "setuptools>=41.0.1",
]

[project.urls]
Homepage = "https://github.com/Nextdoor/ndkale"
Download = "http://pypi.python.org/pypi/ndkale#downloads"

[project.optional-dependencies]
test = [
    "nose==1.3.7",
    "moto>=4.0.0",
    "MarkupSafe==1.1.1",
    "Jinja2==2.11.3",
    "zipp==0.6.0",
    "ecdsa==0.14.1",
]

[tool.setuptools.dynamic]
version = { attr = "kale.version.__version__" }

[tool.setuptools.packages.find]
include = ["kale", "kale.*"]

[dependency-groups]
dev = [
    "nose==1.3.7",
    "moto>=4.0.0",
    "MarkupSafe==1.1.1",
    "Jinja2==2.11.3",
    "zipp==0.6.0",
    "ecdsa==0.14.1",
    "cryptography>=3.3.2",
]
